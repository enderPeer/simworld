name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: Simulation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install the pinned engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify simulation and replay behavior
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore

  website:
    name: Website links and downloads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build current documentation and source downloads
        run: python website/build_content.py
      - name: Check paths, evidence files and download integrity
        run: python website/check_site.py
      - name: Check browser script syntax
        run: |
          node --check website/dist/app.js
          node --check website/dist/portfolio.js
